[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "netorbit-pi"
version = "0.2.2"
description = "A live radial map of your home network for a Raspberry Pi. No Home Assistant needed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "NetOrbit contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "icmplib>=3.0.3",
  "pysnmp>=7.1",
  "aiooui>=0.1.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
netorbit-pi = "netorbit_pi.__main__:main"

[tool.setuptools]
packages = ["netorbit_pi"]

[tool.setuptools.package-data]
netorbit_pi = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
